name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Parser compatibility
        working-directory: integration/formats
        run: |
          go vet ./...
          go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
