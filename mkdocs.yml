site_name: BOA
site_url: https://j0sh.github.io/boa/
site_description: Declarative Go CLI Framework built on Cobra
repo_url: https://github.com/j0sh/boa
repo_name: j0sh/boa

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Reference:
    - Parameters and Struct Tags: struct-tags.md
    - Lifecycle and Errors: lifecycle.md
  - Configuration:
    - Configuration Files: configuration.md
    - Config Decoding: config-decoding.md
    - Live Config Reload: live-reload.md
  - Integration:
    - External Structs: external-structs.md
    - Cobra Interoperability: cobra-interop.md
  - Recipes: recipes.md
  - Migrating from GiGurra/boa: migration.md
